name: Build RefAB installers

# Every push to main builds both installers and publishes them on the Releases page
# as "RefAB <version>" (the version comes from CMakeLists.txt; same version = release updated).
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS installer (.pkg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target RefAB_VST3 RefAB_AU --parallel

      - name: Validate Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/RefAB_artefacts/Release/AU/RefAB.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Rfa1 Rfab
          rm -rf ~/Library/Audio/Plug-Ins/Components/RefAB.component

      - name: Validate VST3 with pluginval
        continue-on-error: true
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process --validate build/RefAB_artefacts/Release/VST3/RefAB.vst3

      - name: Make installer
        run: bash make_installer_mac.sh --no-build

      - name: Test installer
        run: |
          sudo installer -pkg dist/RefAB-*-macOS.pkg -target /
          test -f /Library/Audio/Plug-Ins/VST3/RefAB.vst3/Contents/MacOS/RefAB
          test -d /Library/Audio/Plug-Ins/Components/RefAB.component
          lipo -archs /Library/Audio/Plug-Ins/VST3/RefAB.vst3/Contents/MacOS/RefAB

      - uses: actions/upload-artifact@v4
        with:
          name: RefAB-macOS-installer
          path: dist/*.pkg


  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          cmake -S . -B build
          cmake --build build --config Release --target RefAB_VST3 --parallel

      - name: Validate VST3 with pluginval
        continue-on-error: true
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate build/RefAB_artefacts/Release/VST3/RefAB.vst3

      - name: Install Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: Make installer
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(RefAB VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\RefAB.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\RefAB-*-Windows-Setup.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path "$env:CommonProgramFiles\VST3\RefAB.vst3\Contents\x86_64-win\RefAB.vst3")) { throw "plugin not installed" }

      - uses: actions/upload-artifact@v4
        with:
          name: RefAB-Windows-installer
          path: dist/*.exe

  release:
    name: Publish release
    needs: [ macos, windows ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/^project(RefAB VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: RefAB ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.pkg
            dist/*.exe
          body: |
            **macOS:** скачайте `RefAB-${{ steps.ver.outputs.version }}-macOS.pkg`, дважды кликните и установите (VST3 + AU).
            Если macOS не даёт открыть: Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть».

            **Windows:** скачайте `RefAB-${{ steps.ver.outputs.version }}-Windows-Setup.exe` и запустите (VST3).
            Если появится «Windows защитила ваш компьютер»: Подробнее → Выполнить в любом случае.

            После установки перезапустите DAW и пересканируйте плагины.
